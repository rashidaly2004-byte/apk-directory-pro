  <!--
    EXERCISE 03 — SIGNUP FORM
    Practises: lesson 07 (forms), plus tables from lesson 06

    Build the signup form for a fictional climbing gym.

    There is no stylesheet here, on purpose. Exercises show you raw browser
    defaults so you judge the markup and nothing else. If this page looks
    plain, that's correct.

    Rules for this exercise:
      - every single control has a <label> whose "for" matches the control's "id"
      - every control that should be submitted has a "name"
      - use method="get" while developing, so you can read the submitted data
        straight out of the address bar
      - no placeholder is used as a substitute for a label

    Compare with solution.html when you're done.
  -->

  <h1>Join Northgate Climbing</h1>

  <!-- TODO 1: Open a <form method="get">. Leave the action attribute off
              entirely, which means "submit back to this same page".
              Everything below goes inside the form. -->

                - full name        (text, required, autocomplete="name")
                - email            (type=email, required, autocomplete="email")
                - password         (type=password, required, minlength=8)
                - date of birth    (type=date, required)
                - phone            (type=tel, optional, with a format hint in
                                    a placeholder AND a real label) -->

  <!-- TODO 3: A <fieldset> with <legend>Membership</legend> containing three

  <!-- TODO 5: A number input for "How many years have you been climbing?"

  <!-- TODO 6: A <textarea> for "Anything we should know?" with rows and a
