<!--
  LESSON 1: Basic HTML document structure

  Every HTML page has the same skeleton. Read the comments below in order,
  then open this file in a browser to see how little of it is actually
  visible on the page.
-->
<!DOCTYPE html>
<!--
  ^ Tells the browser "this is a modern HTML5 document".
    It must be the very first line, exactly like this.
-->

<html lang="en">
<!--
  ^ The root element. Everything else lives inside <html>...</html>.
    lang="en" tells browsers/screen readers the page is in English.
-->

<head>
  <!--
    The <head> holds information ABOUT the page, not content the
    visitor sees directly on the page itself.
  -->
  <meta charset="UTF-8" />
  <!-- ^ Sets the character encoding so text (including emoji, accents, etc.) displays correctly. -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- ^ Makes the page behave well on mobile screens. -->

  <title>Lesson 1: Basic Structure</title>
  <!-- ^ This text shows up in the browser tab, not on the page. -->
</head>

<body>
  <!--
    Everything inside <body> IS visible on the page.
  -->

  <h1>Lesson 1: Basic Structure</h1>
  <p>
    If you can see this sentence in your browser, the page loaded correctly!
  </p>
  <p>
    Notice that the text inside &lt;head&gt; (like the &lt;title&gt;) never
    appeared on the page — only the browser tab shows it. Everything you
    see here comes from inside &lt;body&gt;.
  </p>

  <!--
    TRY IT YOURSELF:
    1. Change the text inside <title> and refresh — watch the browser tab.
    2. Add a second <p> paragraph below this comment with a sentence
       about yourself.
    3. Change lang="en" to lang="fr" and think about why a browser
       might care about that (hint: screen readers, spell-check, translation).
  -->

</body>
</html>
